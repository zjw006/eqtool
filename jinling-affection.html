<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>红楼梦 · 金陵好感度</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; }
  body {
    font-family:"STKaiti","KaiTi","Noto Serif SC",serif;
    background:#e9e4d8; color:#2b2b2b;
  }
  .screen { position:fixed; inset:0; display:none; }
  .screen.show { display:block; }

  /* ---------- 标题界面 ---------- */
  #title {
    background:url("assets-jinling/bg_taixu_ink.png") center/cover no-repeat;
  }
  #title .veil {
    position:absolute; inset:0;
    background:radial-gradient(ellipse at center, rgba(243,238,227,.1), rgba(233,228,216,.5));
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  #title h1 {
    font-size:64px; letter-spacing:14px; color:#2b2b2b;
    text-shadow:0 2px 18px rgba(243,238,227,.9), 0 0 40px rgba(243,238,227,.8);
  }
  #title h1::after {
    content:""; display:block; width:120px; height:3px; margin:18px auto 0;
    background:linear-gradient(90deg, transparent, #9e2b25, transparent);
  }
  #title h2 {
    font-size:19px; letter-spacing:8px; color:#6a5c4e; margin:16px 0 48px;
    text-shadow:0 1px 10px rgba(243,238,227,.9);
  }
  .tbtn {
    display:block; width:280px; margin:10px; padding:14px;
    background:rgba(250,247,238,.88); color:#2b2b2b; border:1.5px solid #2b2b2b;
    border-radius:4px; font-family:inherit; font-size:19px; letter-spacing:6px;
    cursor:pointer; text-align:center; transition:all .2s; backdrop-filter:blur(3px);
    box-shadow:3px 3px 0 rgba(43,43,43,.18);
  }
  .tbtn:hover { background:#9e2b25; color:#f5f0e6; border-color:#9e2b25; transform:translateY(-2px); }
  .tbtn.sub { background:rgba(233,228,216,.75); font-size:16px; border-color:#8a7f6e; color:#5a5044; }
  .tbtn.sub:hover { background:#2b2b2b; color:#f5f0e6; border-color:#2b2b2b; }
  #title .tip { position:absolute; bottom:22px; width:100%; text-align:center; color:rgba(60,52,44,.75); font-size:13px; letter-spacing:2px; }

  /* ---------- 游戏主界面 ---------- */
  #game { background:#e9e4d8; }
  #bgLayer {
    position:absolute; inset:0; background:center/cover no-repeat;
    transition:background-image .8s, filter .8s;
  }
  #bgLayer.dim { filter:brightness(.7) saturate(.85); }
  .vignette { position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 60%, rgba(60,52,44,.28)); }

  /* 立绘（单人出场，居中） */
  .sprite {
    position:absolute; bottom:0; left:50%; margin-left:-270px; height:90%; width:auto;
    z-index:2;
    transition:opacity .4s, transform .4s;
    opacity:0; transform:translateY(14px);
    filter:drop-shadow(0 6px 24px rgba(60,52,44,.35));
    pointer-events:none;
  }
  .sprite.on { opacity:1; transform:translateY(0); }
  #spDaiyu { margin-left:-150px; } /* 黛玉出场位偏右 */
  #spBaochai { transform:translateY(14px) scaleX(-1); } /* 宝钗立绘水平镜像 */
  #spBaochai.on { transform:translateY(0) scaleX(-1); }

  /* 顶栏 */
  #hud {
    position:absolute; top:0; left:0; right:0; padding:12px 20px;
    display:flex; align-items:center; gap:16px; z-index:5;
    background:linear-gradient(rgba(243,238,227,.85), transparent);
  }
  #chapterTag {
    color:#2b2b2b; font-size:15px; letter-spacing:3px;
    background:rgba(250,247,238,.85); border:1px solid #2b2b2b; border-radius:3px;
    padding:6px 14px; box-shadow:2px 2px 0 rgba(43,43,43,.15);
  }
  #favorBox { margin-left:auto; color:#2b2b2b; font-size:15px; letter-spacing:2px;
    background:rgba(250,247,238,.85); border:1px solid #2b2b2b; border-radius:3px; padding:6px 16px;
    box-shadow:2px 2px 0 rgba(43,43,43,.15); }
  #favorBar { display:inline-block; width:120px; height:8px; background:rgba(43,43,43,.15);
    border-radius:4px; margin-left:10px; margin-right:8px; vertical-align:middle; overflow:hidden; }
  #favorFill { display:block; height:100%; width:0%; background:linear-gradient(90deg,#9e2b25,#d4675e); transition:width .6s; }
  #favorNum { color:#9e2b25; font-size:14px; font-weight:bold; }

  /* 章节卡（宣纸 + 朱砂印章） */
  #chapterCard {
    position:absolute; inset:0; z-index:8; display:none;
    align-items:center; justify-content:center; flex-direction:column;
    background:rgba(243,238,227,.96);
    background-image:radial-gradient(#ddd5c2 1px, transparent 1px);
    background-size:20px 20px;
  }
  #chapterCard.show { display:flex; animation:fadein .8s; }
  #chapterCard h3 {
    color:#f5f0e6; font-size:16px; letter-spacing:6px; margin-bottom:20px;
    background:#9e2b25; padding:8px 18px 8px 22px; border-radius:3px;
    box-shadow:2px 2px 6px rgba(158,43,37,.4); transform:rotate(-2deg);
  }
  #chapterCard h2 { color:#2b2b2b; font-size:46px; letter-spacing:14px; }
  #chapterCard p { color:rgba(60,52,44,.6); margin-top:30px; font-size:14px; letter-spacing:2px; }
  @keyframes fadein { from{opacity:0} to{opacity:1} }

  /* 对话框（宣纸墨框） */
  #dlg {
    position:absolute; left:50%; transform:translateX(-50%);
    bottom:26px; width:min(880px, 92%); z-index:6;
  }
  #dlgName {
    display:inline-block; background:#9e2b25;
    color:#f5f0e6; padding:7px 26px; border-radius:3px;
    font-size:17px; letter-spacing:4px;
    margin-left:14px; margin-bottom:-2px; min-width:110px; text-align:center;
    box-shadow:2px 2px 6px rgba(158,43,37,.35); position:relative; z-index:2;
  }
  #dlgBox {
    background:rgba(250,247,238,.95); border:1.5px solid #2b2b2b; border-radius:6px;
    padding:20px 26px 26px; min-height:110px; backdrop-filter:blur(3px);
    color:#2b2b2b; font-size:18px; line-height:1.9; cursor:pointer; position:relative;
    box-shadow:4px 4px 0 rgba(43,43,43,.12);
  }
  #dlgBox.narr { color:#6a5c4e; }
  #nextMark {
    position:absolute; right:22px; bottom:12px; color:#9e2b25; font-size:14px;
    animation:blink 1s infinite;
  }
  @keyframes blink { 50%{opacity:.15} }

  /* 选项（黛墨青色系，与宣纸对话框区分） */
  #choices {
    position:absolute; left:50%; top:64px; bottom:26px; transform:translateX(-50%);
    z-index:9; width:min(640px,92%); display:none; flex-direction:column; gap:12px;
    justify-content:center; overflow-y:auto; padding:6px;
  }
  #choices.show { display:flex; }
  #choicePrompt {
    text-align:center; color:#22332e; font-size:19px; letter-spacing:2px; margin-bottom:8px;
    background:rgba(250,247,238,.96); border:1.5px solid #4a7a6e; border-radius:6px;
    padding:14px 20px; line-height:1.7;
    box-shadow:4px 4px 0 rgba(43,43,43,.18);
  }
  #choicePrompt::before { content:"✦ "; color:#9e2b25; }
  #choicePrompt::after { content:" ✦"; color:#9e2b25; }
  .cbtn {
    background:rgba(228,236,230,.94); border:1.5px solid #4a7a6e; border-radius:3px;
    border-left:8px solid #4a7a6e;
    color:#22332e; font-family:inherit; font-size:17px; line-height:1.6;
    padding:13px 22px; cursor:pointer; text-align:left; transition:all .15s;
    backdrop-filter:blur(3px); box-shadow:3px 3px 0 rgba(74,122,110,.2);
  }
  .cbtn::before { content:"◇ "; color:#4a7a6e; }
  .cbtn:hover:not(:disabled) { background:#4a7a6e; color:#eef5f1; transform:translateX(6px); }
  .cbtn:hover:not(:disabled)::before { color:#eef5f1; }
  .cbtn:disabled { cursor:default; }
  .cbtn.best { border-color:#9e2b25; border-left-color:#9e2b25; background:rgba(246,236,228,.96); box-shadow:0 0 14px rgba(158,43,37,.3); }

  /* 考点解析 */
  #analysis {
    position:absolute; right:20px; top:70px; z-index:9; width:min(380px, 86%);
    background:rgba(250,247,238,.97); border:1.5px solid #2b2b2b; border-radius:6px;
    padding:18px 20px; display:none; box-shadow:5px 5px 0 rgba(43,43,43,.15);
  }
  #analysis.show { display:block; animation:pop .25s ease; }
  @keyframes pop { from{transform:scale(.9);opacity:0} to{transform:scale(1);opacity:1} }
  #analysis h4 { color:#9e2b25; letter-spacing:3px; margin-bottom:8px; font-size:16px; }
  #analysis .favor-delta { font-size:15px; margin-bottom:8px; }
  #analysis p { font-size:14.5px; line-height:1.8; }
  #analysis button {
    margin-top:12px; width:100%; padding:9px; background:#2b2b2b; color:#f5f0e6;
    border:none; border-radius:3px; font-family:inherit; font-size:15px; letter-spacing:3px; cursor:pointer;
  }
  #analysis button:hover { background:#9e2b25; }

  /* ---------- 名场面 CG ---------- */
  #cgLayer {
    position:absolute; inset:0; z-index:20; display:none;
    background:#000; cursor:pointer;
  }
  #cgLayer.show { display:block; animation:cgfade 1s ease; }
  @keyframes cgfade { from{opacity:0} to{opacity:1} }
  #cgLayer img {
    position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
    background:#000;
  }
  #cgCaption {
    position:absolute; bottom:8%; left:50%; transform:translateX(-50%);
    color:#f5e9d0; font-size:26px; letter-spacing:10px; white-space:nowrap;
    text-shadow:0 0 20px rgba(0,0,0,.9), 0 2px 8px rgba(0,0,0,.9);
  }
  #cgHint {
    position:absolute; bottom:4%; left:50%; transform:translateX(-50%);
    color:rgba(245,233,208,.55); font-size:13px; letter-spacing:3px;
    animation:blink 1.4s infinite;
  }

  /* ---------- 结局界面 ---------- */
  #ending {
    background:url("assets-jinling/bg_night_ink.png") center/cover no-repeat;
  }
  #ending .veil {
    position:absolute; inset:0; background:rgba(233,228,216,.45);
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px;
  }
  #endCard {
    width:min(620px,92%); background:rgba(250,247,238,.96); border:1.5px solid #2b2b2b;
    border-radius:6px; padding:34px 38px; color:#2b2b2b; text-align:center;
    max-height:88vh; overflow-y:auto; box-shadow:6px 6px 0 rgba(43,43,43,.2);
  }
  #endCard .be { color:#9e2b25; letter-spacing:6px; font-size:15px; }
  #endCard h2 { font-size:40px; letter-spacing:10px; margin:10px 0 4px; color:#2b2b2b; }
  #endCard .judge { color:#6a5c4e; font-size:17px; line-height:2; margin:14px 0; letter-spacing:2px; }
  #endCard .sum {
    text-align:left; background:rgba(158,43,37,.06); border-left:4px solid #9e2b25;
    padding:14px 18px; font-size:14.5px; line-height:1.9; margin-top:14px; border-radius:0 6px 6px 0;
  }
  #endCard .sum b { color:#9e2b25; }

  /* ---------- 图鉴 ---------- */
  #album {
    background:url("assets-jinling/bg_taixu_ink.png") center/cover no-repeat;
  }
  #album .veil {
    position:absolute; inset:0; background:rgba(233,228,216,.6); padding:5vh 16px; overflow-y:auto;
  }
  #album h2 { text-align:center; color:#2b2b2b; letter-spacing:8px; margin-bottom:24px; text-shadow:0 1px 10px rgba(243,238,227,.9); }
  .endGrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px; max-width:900px; margin:0 auto; }
  .endItem {
    background:rgba(250,247,238,.94); border:1.5px solid #2b2b2b; border-radius:6px;
    padding:20px; text-align:center; color:#2b2b2b; box-shadow:4px 4px 0 rgba(43,43,43,.12);
  }
  .endItem.locked { opacity:.4; filter:grayscale(1); }
  .endItem .be { font-size:12px; color:#9e2b25; letter-spacing:3px; }
  .endItem h3 { font-size:22px; letter-spacing:4px; margin:8px 0; }
  .endItem p { font-size:13px; line-height:1.7; color:#6a5c4e; }

  /* ---------- 返回按钮 ---------- */
  .back-to-home {
    position:fixed; top:16px; left:20px; z-index:999;
    background:rgba(250,247,238,.88); color:#2b2b2b;
    border:1.5px solid #2b2b2b; border-radius:4px;
    padding:8px 20px; font-family:inherit; font-size:15px; letter-spacing:4px;
    cursor:pointer; text-decoration:none; transition:all .2s;
    backdrop-filter:blur(3px); box-shadow:3px 3px 0 rgba(43,43,43,.18);
  }
  .back-to-home:hover { background:#9e2b25; color:#f5f0e6; border-color:#9e2b25; transform:translateY(-2px); }
</style>
</head>

<!-- ================= 标题 ================= -->
<div class="screen show" id="title">
  <div class="veil">
    <h1>金陵好感度</h1>
    <h2>红楼梦 · 乙女向考点攻略 · 黛玉线</h2>
    <button class="tbtn" onclick="startGame('daiyu')">黛玉线 · 泪尽还恩</button>
    <button class="tbtn" onclick="startGame('baochai')">宝钗线 · 停机之德</button>
    <button class="tbtn sub" onclick="showScreen('album')">结局图鉴</button>
    <div class="tip">对话选择即考点 · 好感度即理解度 · 所有结局早已写在太虚幻境</div>
  </div>
</div>

<!-- ================= 游戏 ================= -->
<div class="screen" id="game">
  <div id="bgLayer"></div>
  <div class="vignette"></div>
  <img class="sprite" id="spBaoyu" src="assets-jinling/baoyu_ink.png" alt="贾宝玉">
  <img class="sprite" id="spDaiyu" src="assets-jinling/daiyu_ink.png" alt="林黛玉">
  <img class="sprite" id="spBaochai" src="assets-jinling/baochai_ink.png" alt="薛宝钗">
  <div id="hud">
    <span id="chapterTag"></span>
    <span id="favorBox">💗 <span id="favorLabel">黛玉</span>好感度<span id="favorBar"><span id="favorFill"></span></span><span id="favorNum">0</span></span>
  </div>
  <div id="chapterCard"><h3 id="ccNo"></h3><h2 id="ccTitle"></h2><p>轻触任意处继续</p></div>
  <div id="dlg">
    <div id="dlgName"></div>
    <div id="dlgBox" onclick="advance()"><span id="dlgText"></span><span id="nextMark">▼</span></div>
  </div>
  <div id="choices">
    <div id="choicePrompt"></div>
  </div>
  <div id="cgLayer" onclick="dismissCG()">
    <img id="cgImg" src="" alt="名场面">
    <div id="cgCaption"></div>
    <div id="cgHint">轻触继续</div>
  </div>
  <div id="analysis">
    <h4>📌 高考考点解析</h4>
    <div class="favor-delta" id="anaFavor"></div>
    <p id="anaText"></p>
    <button onclick="closeAnalysis()">继续剧情</button>
  </div>
</div>

<!-- ================= 结局 ================= -->
<div class="screen" id="ending">
  <div class="veil">
    <div id="endCard">
      <div class="be">— BAD END · 判词已定 —</div>
      <h2 id="endTitle"></h2>
      <div class="judge" id="endJudge"></div>
      <div class="sum" id="endSum"></div>
      <div style="margin-top:22px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
        <button class="tbtn" style="display:inline-block;width:auto;padding:10px 26px;margin:0;font-size:16px;" onclick="restart()">再入此梦</button>
        <button class="tbtn sub" style="display:inline-block;width:auto;padding:10px 26px;margin:0;" onclick="showScreen('album')">结局图鉴</button>
      </div>
    </div>
  </div>
</div>

<!-- ================= 图鉴 ================= -->
<div class="screen" id="album">
  <div class="veil">
    <h2>太虚幻境 · 薄命司</h2>
    <div class="endGrid" id="endGrid"></div>
    <div style="text-align:center;margin-top:26px;">
      <button class="tbtn sub" style="width:auto;display:inline-block;padding:10px 30px;" onclick="showScreen('title')">返回封面</button>
    </div>
  </div>
</div>

<script>
/* 返回绘本馆 */
function goBack(){
  const from=localStorage.getItem('fromTab');
  const scrollY=localStorage.getItem('fromScroll');
  if(from){
    localStorage.setItem('returnToTab',from);
    localStorage.setItem('returnScroll',scrollY||'0');
  }
  window.location.href='./index.html';
}

/* ============================================================
   剧情数据：黛玉线 · 五章
   who: "旁白" | "宝玉" | "黛玉"
   choice.options: favor 好感增减, best=是否最合人物心境
   ============================================================ */
const STORY_DAIYU = [
{
  no:"第一回", title:"初入贾府", bg:"assets-jinling/bg_xiaoxiang_ink.png",
  steps:[
    {who:"旁白", text:"扬州城外的船行了月余，黛玉终于站在了荣国府门前。母亲新丧，父亲年迈，从此她便是这深宅里“寄人篱下”的客。"},
    {who:"旁白", text:"她想起母亲生前的话：外祖母家与别家不同。于是她步步留心，时时在意，不肯轻易多说一句话，多行一步路。"},
    {who:"宝玉", text:"这个妹妹我曾见过的！"},
    {who:"旁白", text:"宝黛初见，宝玉脱口而出的这句话，让满屋子的人都笑了。可黛玉心头一惊——这人，分明在哪里见过。"},
    {who:"宝玉", text:"妹妹可也有玉没有？"},
    {who:"黛玉", text:"（满屋的目光都落在我身上……这话，该怎么答？）"},
    {choice:{
      prompt:"【抉择】面对宝玉“可也有玉”之问，黛玉最合其性格的反应是？",
      options:[
        { text:"“我没有。想来那玉是一件罕物，岂能人人有的。”——答完便垂下眼去", favor:15, best:true,
          analysis:"考点：人物语言与性格。黛玉答得克制谨慎——入府第一原则是“不肯多说一句话”。但宝玉听后当场摔玉：“什么罕物！家里姐姐妹妹都没有，单我有，我说没趣。”摔玉象征对“金玉良缘”天定命运的反抗，是宝黛爱情与全书主题的第一处伏笔。"},
        { text:"“宝哥哥的玉稀罕，我的玉更稀罕，只是不示人罢了”——笑着顶回去", favor:-5, best:false,
          analysis:"此答机锋外露、锋芒太盛，不符合黛玉初入贾府“步步留心，时时在意”的处境。她此时是客居孤女，语言风格是克制而非张扬。高考人物形象题的第一原则：人物言行必须与其身份处境吻合。"},
        { text:"转身向贾母撒娇：“外祖母，哥哥欺负我！”", favor:-10, best:false,
          analysis:"这是史湘云式的娇憨，不是林黛玉。黛玉的自尊与敏感不允许她在外人面前示弱撒娇。注意区分十二钗各自的“语言指纹”：黛玉含蓄多思、湘云豪爽娇憨、宝钗圆融得体。"}
      ]}},
    {who:"旁白", text:"当夜，黛玉在碧纱橱里垂泪——不是因为想家，而是因为那个为她摔玉的疯癫表哥。鹦哥（紫鹃）劝不住她。"},
    {who:"黛玉", text:"（我第一天来，就惹得他摔了命根子……往后这日子，要怎么过？）"}
  ]
},
{
  no:"第二回", title:"黛玉葬花", bg:"assets-jinling/bg_xiaoxiang_ink.png",
  steps:[
    {who:"旁白", text:"芒种节，满园的女眷都在祭饯花神，独不见黛玉。宝玉寻到山坡下，听见一阵呜咽——"},
    {who:"黛玉", text:"花谢花飞飞满天，红消香断有谁怜？……一年三百六十日，风刀霜剑严相逼。"},
    {cg:"assets-jinling/cg_zanghua_ink.png", caption:"黛 玉 葬 花"},
    {who:"旁白", text:"她肩担花锄，锄上挂着花囊，手把花帚，将满地落花一一收进锦囊，埋进香冢。"},
    {who:"宝玉", text:"（听得痴倒）……妹妹！这花埋在土里，虽干净，到底随水流出去了，依然糟蹋。不如撂在这水里罢？"},

let STORY = STORY_DAIYU, ENDINGS = ENDINGS_DAIYU;

/* ============================================================ 引擎 ============================================================ */
let favor = 50, chIdx = 0, stepIdx = 0, typing = null, fullText = "", waitingChoice = false;
const unlocked = new Set(JSON.parse(localStorage.getItem("hlm_endings")||"[]"));

const $ = id => document.getElementById(id);
function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("show"));
  $(id).classList.add("show");
  if(id==="album") renderAlbum();
}
function setFavor(v){
  favor = Math.max(0, Math.min(100, favor+v));
  $("favorFill").style.width = favor + "%";
  $("favorNum").textContent = favor;
}

let curLine = "daiyu";
function startGame(line){
  curLine = line;
  if(line === "baochai"){
    STORY = STORY_BAOCHAI; ENDINGS = ENDINGS_BAOCHAI;
    $("favorLabel").textContent = "宝钗";
  } else {
    STORY = STORY_DAIYU; ENDINGS = ENDINGS_DAIYU;
    $("favorLabel").textContent = "黛玉";
  }
  favor = 50; chIdx = 0;
  setFavor(0);
  showScreen("game");
  playChapter();
}
function restart(){ startGame(); }

function playChapter(){
  stepIdx = 0;
  const ch = STORY[chIdx];
  $("chapterTag").textContent = ch.no + " · " + ch.title;
  $("bgLayer").style.backgroundImage = `url("${ch.bg}")`;
  $("bgLayer").classList.remove("dim");
  $("ccNo").textContent = ch.no;
  $("ccTitle").textContent = ch.title;
  $("chapterCard").classList.add("show");
  $("dlg").style.display = "none";
  $("chapterCard").onclick = ()=>{
    $("chapterCard").classList.remove("show");
    $("dlg").style.display = "block";
    nextStep();
  };
}

function nextStep(){
  const ch = STORY[chIdx];
  if(stepIdx >= ch.steps.length){
    chIdx++;
    if(chIdx >= STORY.length){ showEnding(); }
    else playChapter();
    return;
  }
  const step = ch.steps[stepIdx++];
  if(step.choice){ showChoice(step.choice); return; }
  if(step.cg){ showCG(step); return; }
  showLine(step.who, step.text);
}

/* 名场面 CG */
function showCG(step){
  $("cgImg").src = step.cg;
  $("cgCaption").textContent = step.caption || "";
  $("cgLayer").classList.add("show");
}
function dismissCG(){
  $("cgLayer").classList.remove("show");
  nextStep();
}

function showLine(who, text){
  waitingChoice = false;
  $("dlgName").textContent = who;
  $("dlgBox").classList.toggle("narr", who==="旁白");
  // 单人出场：谁说话谁上场，旁白时全部退场
  const SPR = {"宝玉":"spBaoyu","黛玉":"spDaiyu","宝钗":"spBaochai"};
  ["spBaoyu","spDaiyu","spBaochai"].forEach(id=> $(id).classList.toggle("on", SPR[who]===id));
  // 打字机（带音效）
  clearInterval(typing);
  fullText = text; $("dlgText").textContent = "";
  let i=0;
  typing = setInterval(()=>{
    i++;
    $("dlgText").textContent = fullText.slice(0,i);
    if(i % 2 === 0) playTick();
    if(i>=fullText.length) clearInterval(typing);
  }, 40);
}

/* 打字音效（WebAudio 合成，无需素材文件） */
let audioCtx = null;
function playTick(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state === "suspended") audioCtx.resume();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "triangle";
    osc.frequency.value = 1400 + Math.random()*500;
    gain.gain.setValueAtTime(0.035, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.05);
  }catch(e){}
}

function advance(){
  if(waitingChoice) return;
  // 打字未完则直接显示全文
  if($("dlgText").textContent.length < fullText.length){
    clearInterval(typing);
    $("dlgText").textContent = fullText;
    return;
  }
  nextStep();
}

function showChoice(choice){
  waitingChoice = true;
  $("dlg").style.display = "none";
  $("bgLayer").classList.add("dim");
  const box = $("choices");
  box.innerHTML = `<div id="choicePrompt">${choice.prompt}</div>`;
  choice.options.forEach((opt,i)=>{
    const b = document.createElement("button");
    b.className = "cbtn";
    b.textContent = opt.text;
    b.onclick = ()=>pickOption(b, opt);
    box.appendChild(b);
  });
  box.classList.add("show");
}

function pickOption(btn, opt){
  document.querySelectorAll("#choices .cbtn").forEach(b=>b.disabled=true);
  if(opt.best) btn.classList.add("best");
  setFavor(opt.favor);
  $("anaFavor").innerHTML = (opt.favor>=0? "💗 好感度 +"+opt.favor : "💔 好感度 "+opt.favor)
    + (opt.best ? "　<span style='color:#4d7c4d;'>✔ 最合黛玉心境</span>" : "　<span style='color:#b03a3a;'>✘ 与人物理解有偏差</span>");
  $("anaText").textContent = opt.analysis;
  $("analysis").classList.add("show");
}

function closeAnalysis(){
  $("analysis").classList.remove("show");
  $("choices").classList.remove("show");
  $("bgLayer").classList.remove("dim");
  $("dlg").style.display = "block";
  waitingChoice = false;
  nextStep();
}

function showEnding(){
  const e = pickEnding(favor);
  unlocked.add(e.id);
  localStorage.setItem("hlm_endings", JSON.stringify([...unlocked]));
  $("ending").style.backgroundImage = `url("${e.bg || "assets-jinling/bg_night_ink.png"}")`;
  document.querySelector("#endCard .be").textContent = "— " + e.be + " —";
  $("endTitle").textContent = e.title;
  $("endJudge").textContent = e.judge;
  const praise = curLine==="baochai"
    ? (favor>=100?"（金兰契阔，蘅芜可托）":favor>=80?"（知冷知热，宝卿可慰）":favor>=50?"（知音半解，尚有遗憾）":"（判词虽定，理解未深——再入此梦罢）")
    : (favor>=100?"（木石同心，仙草垂泪相谢）":favor>=80?"（此心昭昭，绛珠可慰）":favor>=50?"（知音半解，尚有遗憾）":"（判词虽定，理解未深——再入此梦罢）");
  $("endSum").innerHTML = e.sum + `<br><br><b>💗 本局最终好感度：${favor} / 100</b>　${praise}`;
  showScreen("ending");
}

    { be:"BAD END", title:"千里东风", desc:"探春线 · 尚未开放。清明涕送江边望，千里东风一梦遥。" },
    { be:"BAD END", title:"勘破三春", desc:"惜春线 · 尚未开放。缁衣顿改昔年妆。" }

}
