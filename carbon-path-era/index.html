    margin: 0; padding: 0; height: 100%; background: #04070d; overflow: hidden;

  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }

  /* 绘本馆统一返回按钮：仅在宽屏显示，居中画布左侧，避免遮挡竖屏游戏区 */
  .back-to-library { display: none; }
  @media (min-width: 820px) {
    .back-to-library {
      position: fixed; left: 24px; top: 50%; transform: translateY(-50%); z-index: 9999;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 15px; border: 1px solid rgba(122,98,71,.35); border-radius: 999px;
      background: rgba(251,246,233,.92); color: #5C4934;
      font: 600 13px/1 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      text-decoration: none; box-shadow: 0 3px 10px rgba(74,59,42,.14);
      transition: background .15s, transform .15s;
    }
    .back-to-library:hover { background: #FBF6E9; transform: translateY(calc(-50% - 1px)); }
  }
</style>
</head>
