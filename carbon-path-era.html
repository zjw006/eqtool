<script>
(() => {
'use strict';

/* ============ 基础常量 ============ */
const W = 750, H = 1624;
const HORIZON = 422, BASE_Y = 1170;
const LANE_W = 220;
const SPEED = 32;                 // 世界单位/秒
const ATOM_RATIO = 0;             // 原子相对地面静止：以玩家全速冲来
const CLOSE = SPEED * (1 - ATOM_RATIO);
const MAX_PARTICLES = 200;
const SLOT_MAX = 4;
const FUEL_MAX = 3;
const PROBE = /(^|#)probe/.test(location.hash);
const DASHMODE = /(^|#)dash/.test(location.hash);
const HINTMODE = /(^|#)hint/.test(location.hash);
const BENCH = /(^|#)bench/.test(location.hash);
const NOAUDIO = /(^|#)(test|bench|probe|flow|endwin|endlose|otest|wtest|cueshot|deathshot|otest2)/.test(location.hash);
const FLOW = /(^|#)flow/.test(location.hash);
const ENDMODE = /(^|#)end(win|lose)/.exec(location.hash);
const SLOWMODE = /(^|#)slow/.test(location.hash);
const BOOMMODE = /(^|#)boom/.test(location.hash);
const WTEST = /(^|#)wtest/.test(location.hash);
const OTEST = /(^|#)otest/.test(location.hash);
const WINSHOT = /(^|#)winshot/.test(location.hash);
const CUESHOT = /(^|#)cueshot/.test(location.hash);
const GATESHOT2 = /(^|#)gateshot2/.test(location.hash);
const GATESHOT = /(^|#)gateshot/.test(location.hash) && !GATESHOT2;
const DEATHSHOT = /(^|#)deathshot/.test(location.hash);
const MTEST = /(^|#)mtest/.test(location.hash);
const OTEST2 = /(^|#)otest2/.test(location.hash);
const DEMO = /(^|#)demo/.test(location.hash);
const TEST = /[?&]test=1/.test(location.search) || /(^|#)test/.test(location.hash);

const COL = {
  bg0:'#02070a', bg1:'#082330',
  cyan:'#7fe9ff', lane:'rgba(120,235,255,',
  H:'#e8322a', O:'#7CFF4D', white:'#ffffff'
};
const VALENCE = { H:1, O:2, H2:2 };
const SPEC_FREQ = { H:207.7, O:244.5 };     // v0.3 §3.1 谱线音高
const BOND_E = { H:0.97, O:1.03, H2:0.97 };

/* ============ 画布 ============ */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha:false });
let vw=0, vh=0, dpr=1, scale=1, ox=0, oy=0;

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  vw = window.innerWidth; vh = window.innerHeight;
  canvas.width  = Math.max(1, Math.floor(vw*dpr));
  canvas.height = Math.max(1, Math.floor(vh*dpr));
  canvas.style.width = vw+'px'; canvas.style.height = vh+'px';
  scale = Math.min(vw/W, vh/H);
  ox = (vw - W*scale)/2; oy = (vh - H*scale)/2;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

function frameBegin(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,vw,vh);
  const s = scale*dpr;
  ctx.setTransform(s,0,0,s, ox*dpr, oy*dpr);
  ctx.save();
  ctx.beginPath(); ctx.rect(0,0,W,H); ctx.clip();
}
function frameEnd(){ ctx.restore(); }

/* ============ 辉光贴图（禁 shadowBlur） ============ */
function makeGlow(rgb, hard){
  const S=128, cv=document.createElement('canvas'); cv.width=cv.height=S;
  const g=cv.getContext('2d');
  const grd=g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  grd.addColorStop(0,   `rgba(${rgb},1)`);
  grd.addColorStop(0.22,`rgba(${rgb},${hard?0.75:0.55})`);
  grd.addColorStop(0.52,`rgba(${rgb},0.16)`);
  grd.addColorStop(1,   `rgba(${rgb},0)`);
  g.fillStyle=grd; g.fillRect(0,0,S,S);
  return cv;
}
const SPR = {
  white: makeGlow('255,255,255'),
  cyan : makeGlow('127,233,255'),
  H    : makeGlow('232,50,42'),
  O    : makeGlow('124,255,77'),
  spec : makeGlow('255,255,255')
};
function glow(x,y,r,spr,alpha){
  if(r<=0.5||alpha<=0.002) return;
  if(CARTOON) alpha *= 0.60;                 // 卡通风：辉光退到辅助位置
  ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha = Math.min(1, alpha);
  ctx.drawImage(spr, x-r, y-r, r*2, r*2);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation='source-over';
}

/* ============ 背景预渲染 ============ */
let bgCanvas=null;
function buildBackground(){
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const g=cv.getContext('2d');
  const grd=g.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,'#02070a'); grd.addColorStop(.18,'#04121a');
  grd.addColorStop(.27,'#082330'); grd.addColorStop(.34,'#071a23');
  grd.addColorStop(.75,'#041017'); grd.addColorStop(1,'#020a0e');
  g.fillStyle=grd; g.fillRect(0,0,W,H);

  // 远景辉光
  g.globalCompositeOperation='lighter';
  g.globalAlpha=.10; g.drawImage(SPR.cyan, W/2-330, HORIZON-300, 660, 660);
  g.globalAlpha=1; g.globalCompositeOperation='source-over';

  // 能级横线（化学语言）
  for(let i=0;i<5;i++){
    g.strokeStyle=`rgba(90,220,240,${0.05+i*0.012})`;
    g.lineWidth=1; g.beginPath();
    const y=300+i*26; g.moveTo(90,y); g.lineTo(W-90,y); g.stroke();
  }
  // 透视网格
  for(let k=1;k<=26;k++){
    const t=k/26, y=HORIZON+(H-HORIZON)*Math.pow(t,2.1);
    g.strokeStyle=`rgba(70,200,225,${(0.10*(1-t*0.55)).toFixed(3)})`;
    g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke();
  }
  for(let i=-8;i<=8;i++){
    g.strokeStyle='rgba(60,180,205,0.032)';
    g.beginPath(); g.moveTo(W/2,HORIZON); g.lineTo(W/2+i*96,H); g.stroke();
  }
  bgCanvas=cv;
}

/* ============ 车道线 ============ */
function lanePath(off){
  // 从玩家身后（z<0，铺满屏幕下沿）一直采样到接近地平线
  const N = 30;
  ctx.beginPath();
  for(let i=0;i<=N;i++){
    const t = i/N;
    const z = -9 + Math.pow(t, 1.7) * 560;
    const p = projN(z, off);
    if(i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y);
  }
}
function drawLanes(strength){
  const tr=G.tint[0]|0, tg=G.tint[1]|0, tb=G.tint[2]|0;
  for(let i=0;i<3;i++){
    const off = (i-1)*220;
    const slopeGain = 1 + ((G.slope||0) * 0.55);
    const a=(i===1?0.62:0.46)*strength*Math.max(0.45, Math.min(1.5, slopeGain));
    ctx.globalCompositeOperation='lighter';
    // 外层光晕
    ctx.strokeStyle=`rgba(${tr},${tg},${tb},${(a*0.22).toFixed(3)})`;
    ctx.lineWidth=7; lanePath(off); ctx.stroke();
    // 主色
    ctx.strokeStyle=`rgba(${tr},${tg},${tb},${a.toFixed(3)})`;
    ctx.lineWidth=CARTOON ? 3.2 : 1.8; lanePath(off); ctx.stroke();
    if(CARTOON){
      // 亮芯描边：让线条像"画上去的"而不是"发光的"
      ctx.strokeStyle=`rgba(${Math.min(255,tr+70)},${Math.min(255,tg+20)},${Math.min(255,tb+10)},0.55)`;
      ctx.lineWidth=1.2; lanePath(off); ctx.stroke();
    }
    ctx.globalCompositeOperation='source-over';
  }
  // 轨道侧刻度尺：贴着两条外车道外侧的小短横
  for(const off of [-220, 220]){
    const dir = off < 0 ? -1 : 1;
    for(let k=1;k<=24;k++){
      const z = -6 + Math.pow(k/24, 1.6) * 300;
      const pn = projN(z, off);
      if(pn.k < 0.07) continue;
      const len = 5 * pn.k + 3;
      ctx.strokeStyle = 'rgba(120,230,250,' + (0.08 + 0.22*pn.k).toFixed(3) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(pn.x + dir*5, pn.y);
      ctx.lineTo(pn.x + dir*(5+len), pn.y);
      ctx.stroke();
    }
  }

  // 边界双点
  for(const off of [-330,330]){
    for(let k=1;k<=40;k++){
      const z = -6 + Math.pow(k/40, 1.7) * 380;
      const p = proj(z, off);
      const al = 0.10 + (k/40)*0.18;
      ctx.fillStyle=`rgba(110,225,245,${al.toFixed(3)})`;
      ctx.beginPath(); ctx.arc(p.x,p.y-4,1.1,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(p.x,p.y+4,1.1,0,7); ctx.fill();
    }
  }
}

/* ============ 赛道弯曲 ============ */
// 玩家脚下不弯（保证车道可读），越远弯得越多；相位由里程驱动
const ARC_LEN = 130;      // 一段弧沿路的长度
const ARC_GAP = 40;       // 弧与弧之间的直道
const ARC_AMP = 140;      // 横向摆幅（世界单位，投影时乘 k）
const CURVE_ON = false;   // 曲线赛道开关：当前阶段用直线，实现保留
const CARTOON = true;     // 轻度卡通：描边 + 减辉光 + 加线宽（false 回到纯发光风）
const SLIDE_ON = false;   // 坡道关闭：速度恒定

// 坡度：+1 = 急下坡（加速），-1 = 上坡（减速）
function slopeAt(){
  if(!SLIDE_ON) return 0;
  return Math.sin(G.dist * 0.010);
}
const ORDER_RULE = false; // H-O-H 次序规则开关：默认关闭（与教学脚本冲突，待重设计）
function arcOffset(z){
  const s = G.dist * 0.80 + z;                 // 沿路弧长（允许负 z：弧穿过玩家）
  const P = ARC_LEN + ARC_GAP;
  let t = s % P; if(t < 0) t += P;             // 取正模
  const i = Math.floor(s / P);
  const sign = ((i % 2) + 2) % 2 === 0 ? 1 : -1;
  if(t > ARC_LEN) return 0;                    // 直道段
  const u = t / ARC_LEN;
  const prof = Math.sin(Math.PI * u);
  return sign * ARC_AMP * prof * prof;         // 两端斜率为 0，接直道不拐角
}
function roadX(z){
  if(!CURVE_ON) return 0;                      // 直线赛道
  return arcOffset(z);
}

/* ============ 投影 ============ */
function proj(relZ, laneOff){
  const z = relZ;
  const k = 1/(1 + z/26);
  const hz = HORIZON + (G.horizonShift||0);
  return {
    x: W/2 + (roadX(z) - G.roadBase)*k + (laneOff||0)*k,
    y: hz + (BASE_Y-hz)*k,
    k
  };
}

/* ============ 音频 ============ */
const Audio_ = {
  ac:null, master:null, musicGain:null, sfxGain:null,
  muted:false, started:false,
  init(){
    if(this.ac || NOAUDIO) return;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      this.ac = new AC();
      this.master = this.ac.createGain(); this.master.gain.value = 0.85;
      this.master.connect(this.ac.destination);
      this.sfxGain = this.ac.createGain(); this.sfxGain.gain.value = 0.7;
      this.sfxGain.connect(this.master);
      this.musicGain = this.ac.createGain(); this.musicGain.gain.value = 0.75;
      this.musicGain.connect(this.master);

      // 噪声源（一次性生成，whoosh 与风声共用）
      const len = Math.floor(this.ac.sampleRate * 1.5);
      this.noiseBuf = this.ac.createBuffer(1, len, this.ac.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for(let i=0;i<len;i++) d[i] = Math.random()*2-1;

      // S8 常驻风声：带通噪声，cutoff 跟速度
      const src = this.ac.createBufferSource();
      src.buffer = this.noiseBuf; src.loop = true;
      const bp = this.ac.createBiquadFilter();
      bp.type='bandpass'; bp.frequency.value=520; bp.Q.value=0.8;
      const g = this.ac.createGain(); g.gain.value = 0;
      src.connect(bp); bp.connect(g); g.connect(this.master);
      src.start();
      this.wind = {src, bp, g};
    }catch(e){ this.ac=null; }
  },
  resume(){ if(this.ac && this.ac.state==='suspended') this.ac.resume(); },
  tone(freq, dur, type, gain, dest, when){
    if(!this.ac || this.muted) return;
    const t0 = (when!=null? when : this.ac.currentTime);
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type||'sine'; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.001,gain||0.15), t0+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(dest||this.sfxGain);
    o.start(t0); o.stop(t0+dur+0.02);
    return o;
  },
  snap(kind, combo){
    // 钢琴：每加一个键升一级（半音阶梯，封顶一个八度）
    try{
      if(Music && Music.piano){
        const step = Music._step || 0;
        const ch = Music.chordAt(step);
        const base = ROOT * Math.pow(2, (ch[0] + 24 + Music.transpose)/12);
        const lvl = Math.min(12, Math.max(0, (combo||1) - 1) * 2);   // 每键 +2 半音
        Music.piano.triggerAttackRelease(base * Math.pow(2, lvl/12), '16n', Tone.now() + 0.01);
      }
    }catch(e){}
  },
  molecule(types){
    const t = this.ac? this.ac.currentTime : 0;
    types.forEach((k,i)=>{
      let f = SPEC_FREQ[k] || 207.7;
      try{ f = Music.harmonize(f, 12); }catch(e){}
      this.tone(f, 0.5, 'sine', 0.14, null, t+i*0.012);
    });
  },
  dash(){
    if(!this.ac || this.muted) return;
    const t0=this.ac.currentTime;
    const o=this.ac.createOscillator(), g=this.ac.createGain();
    o.type='sawtooth'; o.frequency.setValueAtTime(900,t0);
    o.frequency.exponentialRampToValueAtTime(180,t0+0.35);
    g.gain.setValueAtTime(0.14,t0);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+0.4);
    o.connect(g); g.connect(this.sfxGain); o.start(t0); o.stop(t0+0.42);
  },
  reject(){
    this.tone(220,0.25,'sine',0.20);
    this.tone(207.7,0.34,'sine',0.16);
  },
  breakBond(){
    this.tone(320,0.10,'square',0.05);
    this.tone(160,0.22,'sine',0.12);
  },
  ui(){ this.tone(2000,0.05,'square',0.05); },

  // S7 换道 whoosh：带通噪声上扫 + 声像随方向
  whoosh(dir){
    if(!this.ac || this.muted || !this.noiseBuf) return;
    const t0 = this.ac.currentTime;
    if(t0 - (this._lastWhoosh||0) < 0.08) return;
    this._lastWhoosh = t0;
    const src = this.ac.createBufferSource();
    src.buffer = this.noiseBuf;
    const bp = this.ac.createBiquadFilter();
    bp.type='bandpass'; bp.Q.value=1.1;
    bp.frequency.setValueAtTime(420, t0);
    bp.frequency.exponentialRampToValueAtTime(1150, t0+0.12);
    const g = this.ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.16, t0+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+0.16);
    src.connect(bp); bp.connect(g);
    if(this.ac.createStereoPanner){
      const pn = this.ac.createStereoPanner();
      pn.pan.value = Math.max(-1, Math.min(1, dir*0.5));
      g.connect(pn); pn.connect(this.sfxGain);
    } else {
      g.connect(this.sfxGain);
    }
    src.start(t0); src.stop(t0+0.18);
  },

  // S8 风声：音量与截止频率跟速度
  setWind(mul){
    if(!this.wind) return;
    const m = this.muted ? 0 : 1;
    if(mul >= 1){
      // 加速：频率上扫、音量上扬
      this.wind.g.gain.value = (0.012 + 0.055*(mul-1))*m;
      this.wind.bp.frequency.value = 420 + 900*(mul-1);
      this.wind.bp.Q.value = 0.8;
    } else {
      // 减速：频率下沉、轻微变闷变厚（"被拖住"的摩擦感）
      const k = 1 - mul;                       // 0 → 1
      this.wind.g.gain.value = (0.012 + 0.020*k)*m;
      this.wind.bp.frequency.value = 420 - 210*k;
      this.wind.bp.Q.value = 1.6;              // Q 调高 → 更闷的窄带
    }
  }
};

/* 化学音阶（v0.3 §3.1 五条谱线，升八度） */
const SCALE = [145.0, 207.7, 216.4, 231.3, 244.5].map(f=>f*2);
const BPM = 128;
const STEP_T = 60 / BPM / 4;          // 16 分音符时长
const BEAT16 = STEP_T;                // 生成器用的节拍格（秒）
// A 小调四和弦：Am - F - C - G（半音偏移，相对 A2=110Hz）
const CHORDS = [
  [0, 3, 7],      // Am
  [-4, 0, 5],     // F
  [3, 7, 10],     // C
  [-2, 2, 7]      // G
];
const ROOT = 110;                     // A2

const Music = {
  on:false, built:false, transpose:0, seq:null,
  kick:null, bass:null, arp:null,
  _n:0,

  build(){
    if(this.built) return;
    if(typeof Tone === 'undefined'){ console.warn('Tone.js 未加载'); return; }
    this.kick = new Tone.MembraneSynth({
      pitchDecay:0.05, octaves:7,
      envelope:{ attack:0.001, decay:0.22, sustain:0, release:0.10 }
    }).toDestination();
    this.kick.volume.value = -8;

    this.bass = new Tone.MonoSynth({
      oscillator:{ type:'triangle' },
      envelope:{ attack:0.008, decay:0.18, sustain:0.55, release:0.25 },
      filter:{ Q:1, type:'lowpass' }
    }).toDestination();
    this.bass.volume.value = -14;

    this.arp = new Tone.PolySynth(Tone.Synth, {
      oscillator:{ type:'sine' },
      envelope:{ attack:0.004, decay:0.16, sustain:0, release:0.22 }
    }).toDestination();
    this.arp.volume.value = -16;

    // 军鼓：噪声 + 高通
    this.snare = new Tone.NoiseSynth({
      noise:{ type:'white' },
      envelope:{ attack:0.001, decay:0.16, sustain:0, release:0.05 }
    }).toDestination();
    this.snare.volume.value = -18;
    this.snareFilter = new Tone.Filter(1400, 'highpass').toDestination();
    this.snare.disconnect(); this.snare.connect(this.snareFilter);

    // 踩镲：高通噪声，极短
    this.hat = new Tone.NoiseSynth({
      noise:{ type:'white' },
      envelope:{ attack:0.001, decay:0.045, sustain:0, release:0.01 }
    }).toDestination();
    this.hat.volume.value = -26;
    this.hatFilter = new Tone.Filter(7000, 'highpass').toDestination();
    this.hat.disconnect(); this.hat.connect(this.hatFilter);

    // 混响：给弦乐和钢琴空间感
    this.reverb = new Tone.Reverb({ decay:3.6, preDelay:0.02, wet:0.42 }).toDestination();
    try{ this.reverb.generate(); }catch(e){}

    // 弦乐铺底：锯齿波 + 慢起音 + 低通
    this.stringsFilter = new Tone.Filter(950, 'lowpass');
    this.stringsFilter.connect(this.reverb);
    this.strings = new Tone.PolySynth(Tone.Synth, {
      oscillator:{ type:'sawtooth' },
      envelope:{ attack:0.85, decay:0.5, sustain:0.55, release:2.4 }
    }).connect(this.stringsFilter);
    this.strings.volume.value = -33;

    // 弦乐滑音：单声部 + portamento，换道时音高滑过去
    this.glide = new Tone.MonoSynth({
      oscillator:{ type:'sawtooth' },
      envelope:{ attack:0.028, decay:0.22, sustain:0.22, release:0.30 },
      filter:{ type:'lowpass', Q:1 },
      filterEnvelope:{ attack:0.005, decay:0.12, sustain:0.2, release:0.2, baseFrequency:900, octaves:1.8 },
      portamento: 0.16
    }).connect(this.stringsFilter);
    this.glide.volume.value = -25;

    // 保留一个拨奏（备用）
    this.pluck = new Tone.PolySynth(Tone.Synth, {
      oscillator:{ type:'sawtooth' },
      envelope:{ attack:0.006, decay:0.16, sustain:0.05, release:0.25 }
    }).connect(this.stringsFilter);
    this.pluck.volume.value = -28;

    // 门前预告用的钢琴（更响）
    this.pianoLoud = new Tone.FMSynth({
      harmonicity: 2.5,
      modulationIndex: 5,
      envelope:{ attack:0.002, decay:0.9, sustain:0.05, release:1.6 },
      modulationEnvelope:{ attack:0.002, decay:0.4, sustain:0.1, release:0.7 }
    }).connect(this.reverb);
    this.pianoLoud.volume.value = -9;

    // 钢琴感：FM 合成，快起音 + 长衰减
    this.piano = new Tone.FMSynth({
      harmonicity: 2.5,
      modulationIndex: 5,
      envelope:{ attack:0.002, decay:0.75, sustain:0.06, release:1.2 },
      modulationEnvelope:{ attack:0.002, decay:0.35, sustain:0.1, release:0.6 }
    }).connect(this.reverb);
    this.piano.volume.value = -21;

    this.built = true;
  },

  chordAt(step){ return CHORDS[Math.floor(step/16) % CHORDS.length]; },
  hz(step, idx){
    const ch = this.chordAt(step);
    const semi = ch[idx % ch.length] + (Math.floor(step/16)%2===0 ? 12 : 24) + this.transpose;
    return ROOT * Math.pow(2, semi/12);
  },

  startSeq(){
    if(this.seq) return;
    const self = this;
    const STEPS = new Array(16).fill(0).map((_,i)=>i);
    // 固定动机：和弦音序 0-1-2-1，每 2 步一个音，两小节一轮
    const MOTIF = [0, 1, 2, 1, 0, 2, 1, 2];
    // 节奏型（16 分网格）
    const KICK  = [0, 6, 8, 11];          // 四踩 + 一个切分
    const SNARE = [4, 12];                // 第 2、4 拍
    const HAT   = [1,3,5,7,9,11,13,15];   // 反拍 8 分

    this.seq = new Tone.Sequence((time, step) => {
      self._n++;
      self._step = (self._step || 0) + 1;

      // 底鼓
      if(KICK.indexOf(step) >= 0) self.kick.triggerAttackRelease('C1', '8n', time);
      // 军鼓
      if(SNARE.indexOf(step) >= 0) self.snare.triggerAttackRelease('16n', time);
      // 踩镲
      if(HAT.indexOf(step) >= 0) self.hat.triggerAttackRelease('32n', time);

      // 低音：每小节两次
      if(step === 0 || step === 8){
        const ch = self.chordAt(step);
        const f = ROOT * Math.pow(2, (ch[0]-12+self.transpose)/12);
        self.bass.triggerAttackRelease(f, '8n', time);
      }

      // 动机：每 2 步一个音
      if(step % 2 === 0){
        const idx = Math.floor(step/2) % MOTIF.length;
        const deg = MOTIF[idx];
        const ch = self.chordAt(step);
        const semi = ch[deg % ch.length] + 12 + self.transpose;
        const f = ROOT * Math.pow(2, semi/12);
        // 每两小节升八度一次，制造起伏
        const lift = (Math.floor(step/32) % 2 === 0) ? 1 : 2;
        self.arp.triggerAttackRelease(f*lift, '16n', time);
      }

      // 弦乐：每小节开头铺一个和弦（持续一整小节）
      if(step === 0){
        const ch = self.chordAt(step);
        const notes = ch.map(semi => ROOT * Math.pow(2, (semi + 12 + self.transpose)/12));
        self.strings.triggerAttackRelease(notes, '1m', time);
      }

      // 钢琴：每小节第 1、3 拍点一个高音，音色和琶音错开
      if(step === 0 || step === 8){
        const idx = (Math.floor(step/8) % 2) ? 1 : 0;
        const ch = self.chordAt(step);
        const f = ROOT * Math.pow(2, (ch[idx] + 24 + self.transpose)/12);
        self.piano.triggerAttackRelease(f, '8n', time);
      }

      // 每小节最后一拍加一个高音点缀
      if(step === 14){
        const ch = self.chordAt(step);
        const f = ROOT * Math.pow(2, (ch[2] + 24 + self.transpose)/12);
        self.arp.triggerAttackRelease(f, '32n', time);
      }
    }, STEPS, '16n');
    this.seq.loop = true;
    this.seq.start(0);
  },

  start(){
    if(this.on) return;
    this.build();
    if(!this.built) return;
    const go = ()=>{
      Tone.Transport.bpm.value = BPM;
      this.startSeq();
      Tone.Transport.start();
      this.on = true;
    };
    try{
      const pr = Tone.start();
      if(pr && pr.then) pr.then(go).catch(go);
      else go();
    }catch(e){ go(); }
  },

  stop(){
    try{ Tone.Transport.stop(); }catch(e){}
    this.on = false;
  },
  pause(){
    try{
      if(!this.on) return;
      Tone.Transport.pause();
      Tone.getDestination().volume.rampTo(-60, 0.04);   // 立刻静音
    }catch(e){}
  },
  resume(){
    try{
      if(!this.on) return;
      Tone.getDestination().volume.rampTo(0, 0.08);
      Tone.Transport.start();
    }catch(e){}
  },
  duck(sec, db){
    try{ if(typeof Tone!=='undefined') Tone.getDestination().volume.rampTo(db, sec); }catch(e){}
  },
  unduck(){
    try{ if(typeof Tone!=='undefined') Tone.getDestination().volume.rampTo(0, 0.35); }catch(e){}
  },

  // 接近终点门的钢琴琶音（high=true 时高八度）
  gateArp(high){
    try{
      if(!this.pianoLoud) return;
      const ch = this.chordAt(this._step || 0);
      const oct = high ? 24 : 12;
      const t0 = Tone.now() + 0.02;
      ch.forEach((semi,i)=>{
        const f = ROOT * Math.pow(2, (semi + oct + this.transpose)/12);
        this.pianoLoud.triggerAttackRelease(f, '8n', t0 + i*0.13);
      });
      // 收尾一个高音
      const f2 = ROOT * Math.pow(2, (ch[2] + oct + 12 + this.transpose)/12);
      this.pianoLoud.triggerAttackRelease(f2, '4n', t0 + ch.length*0.13 + 0.05);
    }catch(e){}
  },

  // 供音效吸附用：把任意频率拉到当前和弦音
  harmonize(freq, octShift){
    const step = this._step || 0;
    const ch = this.chordAt(step);
    let best = freq, err0 = 1e9;
    for(let oct=-1; oct<=2; oct++){
      for(const semi of ch){
        const cand = ROOT * Math.pow(2, (semi + 12*oct + (octShift||0))/12);
        const err = Math.abs(Math.log(cand/freq));
        if(err < err0){ err0 = err; best = cand; }
      }
    }
    return best;
  }
};
function pow2(semi){ return Math.pow(2, semi/12); }
