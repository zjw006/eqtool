      G.atoms = [{lane:G.player.lane, relZ:z, type:'O', taken:false, born:0, wob:0}];
      onDownSwipe();
      res.push(z + ':' + (G.trail.length===2 ? 'ok':'NO'));
    }
    document.getElementById('diag').classList.add('on');
    document.getElementById('diag').textContent = JSON.stringify(res);
    return;
  }
  if(DEATHSHOT){
    startGame('main');
    G.spawnTimer = 999;
    G.trail = []; G.player.used = 0;          // 没键，撞墙即湮灭
    G.walls = [{relZ:6, lane:G.player.lane, broken:false, hitDone:false, hits:0, seed:0}];
    for(let i=0;i<40;i++) update(1/60);       // 触发湮灭并演 0.6 秒
    frozen = true;
    document.getElementById('diag').classList.remove('on');
    requestAnimationFrame(loop);
    return;
  }
  if(MTEST){
    startGame('main');
    Audio_.init(); Audio_.resume(); Music.start();
    setTimeout(()=>{
      let tinfo = {};
      try{
        tinfo = {
          toneType: typeof Tone,
          ver: (typeof Tone!=='undefined') ? Tone.version : null,
          ctxState: (typeof Tone!=='undefined' && Tone.context) ? Tone.context.state : null,
          transportState: (typeof Tone!=='undefined') ? Tone.Transport.state : null,
          bpm: (typeof Tone!=='undefined') ? Tone.Transport.bpm.value : null
        };
      }catch(e){ tinfo.err = String(e); }
      document.getElementById('diag').classList.add('on');
      document.getElementById('diag').textContent = JSON.stringify(Object.assign({
        ac: !!Audio_.ac, state: Audio_.ac && Audio_.ac.state,
        on: Music.on, built: Music.built, played: Music._n||0,
        t: Audio_.ac && +Audio_.ac.currentTime.toFixed(2)
      }, tinfo));
      requestAnimationFrame(loop);
    }, 1800);
    return;
  }
  if(GATESHOT || GATESHOT2){
    startGame('main');
    for(let i=0;i<120;i++) update(1/60);
    G.finalGate = true;
    G.gate = { relZ: 120, passed:false, done:false, active:true, lane:1, window:16 };
    if(GATESHOT){
      G.trail = [{type:'H',node:{x:340,y:1040,vx:0,vy:0}},{type:'O',node:{x:375,y:1000,vx:0,vy:0}},{type:'H',node:{x:410,y:960,vx:0,vy:0}}];
      G.player.used = 4;
    } else {
      G.trail = [{type:'H',node:{x:375,y:1020,vx:0,vy:0}}];
      G.player.used = 1;
    }
    G.gateOpen = GATESHOT;
    document.getElementById('diag').classList.remove('on');
    requestAnimationFrame(loop);
    return;
  }
  if(CUESHOT){
    startGame('main');
    for(let i=0;i<150;i++) update(1/60);
    // 造一面正对玩家的墙，并触发引导
    G.walls = [{relZ:18, lane:G.player.lane, broken:false, hitDone:false, hits:0, seed:0}];
    G.taughtLane = false; G.cue = { type:'lane', t:0.2, dir:(G.player.lane>0?-1:1), lane:G.player.lane };
    document.getElementById('diag').classList.remove('on');
    requestAnimationFrame(loop);
    return;
  }
  if(WINSHOT){
    startGame('main');
    G.time = 41.8; G.stats.breaks = 1; G.gateFail = 0;
    G.mode = 'win';
    document.getElementById('diag').classList.remove('on');
    requestAnimationFrame(loop);
    return;
  }
  if(OTEST){
    startGame('main');
    G.spawnTimer = 999; G.walls = []; G.finalGate = true;
    G.atoms = [{lane:G.player.lane, relZ:6, type:'O', taken:false, born:0, wob:0}];
    for(let i=0;i<40;i++) update(1/60);
    const afterPass = G.trail.length;
    G.atoms.push({lane:G.player.lane, relZ:6, type:'O', taken:false, born:0, wob:0});
    for(let i=0;i<3;i++) update(1/60);
    onDownSwipe();
    for(let i=0;i<3;i++) update(1/60);
    document.getElementById('diag').classList.add('on');
    document.getElementById('diag').textContent = JSON.stringify({autoAttach: afterPass, afterSwipe: G.trail.length});
    return;
  }
  if(WTEST){
    startGame('main');
    const out = [];
    for(let i=0;i<600;i++){ update(1/60); if(i%60===0) out.push(G.walls.length); }
    document.getElementById('diag').classList.add('on');
    document.getElementById('diag').textContent = JSON.stringify({seg:G.segIdx, walls:out, wt:G.wallT, n:G.walls.length, lane:G.walls[0]&&G.walls[0].lane, z:G.walls[0]&&G.walls[0].relZ});
    return;
  }
  if(BOOMMODE){
    startGame('main');
    G.trail = [
      {type:'H', node:{x:340,y:1040,vx:0,vy:0}, born:0},
      {type:'H', node:{x:380,y:980,vx:0,vy:0}, born:0}
    ];
    G.player.used = 2;
    attachAtom({type:'O', relZ:2, lane:1});
    for(let i=0;i<3;i++) update(1/60);
    frozen = true;
    document.getElementById('diag').classList.remove('on');
    requestAnimationFrame(loop);
    return;
  }
  if(SLOWMODE){
    startGame('main');
    G.segIdx = 2; G.segT = 10;
    for(let i=0;i<240;i++){ midStep(); update(1/60); }
    frozen = true;
    document.getElementById('diag').classList.remove('on');
    requestAnimationFrame(loop);
    return;
  }
  if(ENDMODE){
    startGame('main');
    let g=0;
    while(G.mode==='play' && g<60*160){
      if(ENDMODE[2]==='lose'){ // 故意摆烂：不换道、不断键
        update(1/60);
      } else {
        midStep(); update(1/60);
      }
      g++;
    }
    frozen = true;
    document.getElementById('diag').classList.remove('on');
    requestAnimationFrame(loop);
    return;
  }
  if(FLOW){
    startGame('main');
    const ev=[]; let lastSeg=-1, lastPass=false, lastName='';
    for(let i=0;i<6000;i++){
      midStep(); update(1/60);
      const nm=G.walls.map(w=>w.broken?1:0).join('')+'|'+G.gate.passed+'|'+G.mode;
      if(G.segIdx!==lastSeg){ ev.push({t:+G.time.toFixed(1), seg:G.segIdx, tint:G.tint.map(v=>v|0).join(',')}); lastSeg=G.segIdx; }
      if(G.gate.passed!==lastPass){ ev.push({t:+G.time.toFixed(1), gate:G.gate.passed?'pass':'wait'}); lastPass=G.gate.passed; }
      if(nm!==lastName && G.gate.passed){ ev.push({t:+G.time.toFixed(1), walls:nm}); lastName=nm; }
      if(G.mode!=='play') break;
    }
    ev.push({end:G.mode, t:+G.time.toFixed(1)});
    const el=document.getElementById('diag');
    el.textContent=JSON.stringify(ev); el.classList.add('on');
    return;
  }
  if(BENCH){
    const r = bench();
    const el=document.getElementById('diag');
    el.textContent=JSON.stringify(r); el.classList.add('on');
    return;
  }
  if(TEST){
    window.__diag = selfTest();
    startGame();
    botOn = true;
    requestAnimationFrame(loop);
    return;
  }
  if(DEMO){
    startGame();
    for(let i=0;i<720;i++){ botStep(); update(1/60); }
    let g2=0;
    while(G.hint.t>0 && g2<300){ botStep(); update(1/60); g2++; }
    frozen = true;
    document.getElementById('diag').classList.remove('on');
    requestAnimationFrame(loop);
    return;
  }
  requestAnimationFrame(loop);
  window.addEventListener('resize', ()=>{ resize(); });
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden && G.mode==='play') G.mode='pause'; });
  window.addEventListener('keydown', e=>{ if(e.key==='d') diagOn=!diagOn; });
}

try{
  boot();
}catch(err){
  const el=document.getElementById('diag');
  el.textContent='BOOT ERROR: '+ (err && err.stack || err);
  el.classList.add('on');
  el.style.opacity=1; el.style.color='#f66';
}
})();
</script>
</body>
</html>
